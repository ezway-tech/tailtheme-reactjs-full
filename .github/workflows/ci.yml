name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:run
      - run: npm run test:create-project
      - run: npm run build

  export-smoke:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Export minimal
        run: npm run create:project -- --preset minimal --out "$RUNNER_TEMP/tt-minimal"
      - name: Build minimal export
        working-directory: ${{ runner.temp }}/tt-minimal
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Export project module
        run: npm run create:project -- --modules project --out "$RUNNER_TEMP/tt-project"
      - name: Build project export
        working-directory: ${{ runner.temp }}/tt-project
        run: |
          npm install
          npm run typecheck
          npm run build
